/* ============================================================
 * 文游工坊 · 播放器样式（编辑器试玩 + 导出的独立游戏共用）
 * ============================================================ */

.wy-player {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--wy-bg, #0f1115);
  color: var(--wy-fg, #e9edf2);
  font-size: var(--wy-fs, 18px);
  line-height: 1.85;
  font-family: var(--wy-font, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC",
               "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: manipulation;
}

.wy-player.wy-embed {
  position: absolute;
  border-radius: 12px;
}

/* ---------- 背景 ---------- */

.wy-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: opacity .45s ease;
  opacity: 0;
}
.wy-bg.wy-on { opacity: 1; }

.wy-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--wy-bg, #0f1115) 55%, transparent) 0%,
    transparent 22%,
    transparent 40%,
    color-mix(in srgb, var(--wy-bg, #0f1115) 88%, transparent) 72%,
    var(--wy-bg, #0f1115) 100%);
  pointer-events: none;
}

/* ---------- 顶栏 ---------- */

.wy-top {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
  min-height: 48px;
}

.wy-title {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  opacity: .72;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .5px;
}

.wy-ibtn {
  flex: none;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 10px;
  background: color-mix(in srgb, var(--wy-fg, #fff) 10%, transparent);
  color: inherit;
  font-size: 16px;
  cursor: pointer;
  transition: background .15s;
}
.wy-ibtn:active { background: color-mix(in srgb, var(--wy-fg, #fff) 22%, transparent); }
.wy-ibtn[disabled] { opacity: .3; pointer-events: none; }

/* ---------- 变量 HUD ---------- */

.wy-hud {
  position: relative;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 14px;
}
.wy-hud:empty { display: none; }

.wy-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1.6;
  background: color-mix(in srgb, var(--wy-fg, #fff) 11%, transparent);
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 8%, transparent);
}
.wy-chip b { color: var(--wy-accent, #5aa9ff); font-weight: 600; }
.wy-chip.wy-flash { animation: wy-pop .5s ease; }
@keyframes wy-pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.22); background: color-mix(in srgb, var(--wy-accent, #5aa9ff) 35%, transparent); }
  100% { transform: scale(1); }
}

/* ---------- 正文与选项 ---------- */

.wy-main {
  position: relative;
  z-index: 3;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  overflow-y: auto;
  overscroll-behavior: contain;
}

.wy-textbox {
  flex: none;
  margin-top: auto;              /* 钉在画面最底下 */
  max-height: var(--wy-box-max, 40%);   /* 长台词不顶上去挡立绘，超出在框里滚 */
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px 18px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--wy-bg, #0f1115) 72%, transparent);
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 10%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  white-space: pre-wrap;
  word-break: break-word;
  min-height: 3em;
}

.wy-caret {
  display: inline-block;
  width: .55em;
  height: 1em;
  margin-left: 2px;
  vertical-align: -.13em;
  background: var(--wy-accent, #5aa9ff);
  animation: wy-blink 1s steps(1) infinite;
}
@keyframes wy-blink { 50% { opacity: 0; } }

.wy-next-hint {
  text-align: right;
  font-size: 12px;
  opacity: .5;
  padding: 6px 4px 0;
  animation: wy-blink 1.6s ease-in-out infinite;
}

.wy-main.wy-center { justify-content: center; }
.wy-main.wy-center .wy-textbox { display: none; }

.wy-choices {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 9px;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  margin-top: 14px;
  z-index: 6;
}
.wy-choices:empty { padding: 0; margin: 0; }
.wy-choices.wy-align-center { align-items: center; }
.wy-choices.wy-align-center .wy-choice { text-align: center; }

/* 作者选了「顶部常驻」变量时，主区域不用再留底部安全边距 */
.wy-player.wy-has-choices .wy-main { padding-bottom: 6px; }

/* ---- 选项位置 ---- */

/* 对话框下方：选项跟在对话框下面。其实就是基础布局，写出来是为了显式 */
.wy-player.wy-ch-below .wy-choices { position: static; margin-top: 6px; }

.wy-player.wy-ch-center .wy-choices {
  position: absolute;
  left: 0; right: 0; top: 50%;
  transform: translateY(-50%);
  margin: 0;
}
.wy-player.wy-ch-center .wy-main { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }

.wy-player.wy-ch-bottom .wy-choices {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  margin: 0;
}
.wy-player.wy-ch-bottom .wy-main { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }

/* ---- 选项形状 ---- */
.wy-player.wy-shape-card .wy-choice {
  border-radius: 16px;
  padding: 13px 20px;
  text-align: center;
}
.wy-player.wy-shape-plain .wy-choice {
  background-color: transparent;
  background-image: none;
  border: none;
  border-bottom: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 12%, transparent);
  border-radius: 0;
  padding: 12px 4px;
}
.wy-player.wy-shape-plain .wy-choice::before { content: "▸ "; }
.wy-player.wy-shape-numbered .wy-choices { counter-reset: wyc; }
.wy-player.wy-shape-numbered .wy-choice { counter-increment: wyc; }
.wy-player.wy-shape-numbered .wy-choice::before {
  content: counter(wyc) ". ";
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

.wy-choice {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 16px;
  border-radius: 12px;
  font-size: 1em;
  line-height: 1.55;
  font-family: inherit;
  color: inherit;
  cursor: pointer;
  background-color: color-mix(in srgb, var(--wy-fg, #fff) 8%, transparent);
  background-image: var(--wy-choice-img, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  /* 这里原来用的是强调色（默认蓝）—— 作者换上自己的素材后，
     这条蓝边会露在图片外面，看着很突兀。改成中性色。 */
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 15%, transparent);
  width: var(--wy-choice-w, 100%);
  max-width: 100%;
  transition: transform .12s ease, background-color .15s;
  animation: wy-rise .32s ease backwards;
}
.wy-choice:active {
  transform: scale(.985);
  background-color: color-mix(in srgb, var(--wy-accent, #5aa9ff) 26%, transparent);
}
.wy-choice::before {
  content: "▸ ";
  color: var(--wy-accent, #5aa9ff);
  opacity: .85;
}
@keyframes wy-rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ---------- 结局 ---------- */

.wy-ending {
  text-align: center;
  padding: 26px 20px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--wy-bg, #0f1115) 86%, transparent);
  border: 1px solid color-mix(in srgb, var(--wy-accent, #5aa9ff) 40%, transparent);
  animation: wy-rise .45s ease backwards;
}
.wy-ending-tag {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--wy-accent, #5aa9ff);
  border: 1px solid color-mix(in srgb, var(--wy-accent, #5aa9ff) 50%, transparent);
  border-radius: 999px;
  padding: 3px 12px;
  margin-bottom: 12px;
}
.wy-ending-title {
  font-size: 1.5em;
  font-weight: 700;
  margin: 4px 0 10px;
  letter-spacing: 1px;
}
.wy-ending-text {
  opacity: .82;
  white-space: pre-wrap;
  margin-bottom: 18px;
}
.wy-ending-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

.wy-btn {
  padding: 11px 20px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 18%, transparent);
  background: color-mix(in srgb, var(--wy-fg, #fff) 9%, transparent);
  color: inherit;
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
}
.wy-btn:active { background: color-mix(in srgb, var(--wy-fg, #fff) 20%, transparent); }
.wy-btn.wy-primary {
  background: var(--wy-accent, #5aa9ff);
  border-color: var(--wy-accent, #5aa9ff);
  color: #08111c;
  font-weight: 600;
}

/* ---------- 弹出面板（存档/设置） ---------- */

.wy-sheet {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  background: rgba(0, 0, 0, .55);
  animation: wy-fade .2s ease;
}
@keyframes wy-fade { from { opacity: 0; } to { opacity: 1; } }

.wy-sheet-body {
  width: 100%;
  max-height: 82%;
  overflow-y: auto;
  background: color-mix(in srgb, var(--wy-bg, #0f1115) 96%, #fff 4%);
  border-radius: 18px 18px 0 0;
  border-top: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 14%, transparent);
  padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 22px);
  animation: wy-slide .26s cubic-bezier(.2, .8, .3, 1);
}
@keyframes wy-slide { from { transform: translateY(100%); } to { transform: none; } }

.wy-sheet-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.wy-slot {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-radius: 12px;
  margin-bottom: 9px;
  background: color-mix(in srgb, var(--wy-fg, #fff) 7%, transparent);
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 8%, transparent);
}
.wy-slot-info { flex: 1; min-width: 0; }
.wy-slot-name { font-size: 14px; font-weight: 600; }
.wy-slot-meta { font-size: 12px; opacity: .55; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wy-slot-acts { display: flex; gap: 7px; flex: none; }
.wy-slot-acts .wy-btn { padding: 7px 13px; font-size: 13px; }

.wy-field { margin-bottom: 18px; }
.wy-field-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  opacity: .7;
  margin-bottom: 9px;
}
.wy-range {
  width: 100%;
  accent-color: var(--wy-accent, #5aa9ff);
  height: 26px;
}
.wy-seg { display: flex; gap: 8px; }
.wy-seg .wy-btn { flex: 1; padding: 9px 8px; font-size: 14px; }
.wy-seg .wy-btn.on {
  background: var(--wy-accent, #5aa9ff);
  border-color: var(--wy-accent, #5aa9ff);
  color: #08111c;
  font-weight: 600;
}

.wy-toast {
  position: absolute;
  left: 50%;
  bottom: 20%;
  transform: translateX(-50%);
  z-index: 30;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  background: rgba(0, 0, 0, .82);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, .14);
  animation: wy-fade .2s ease;
  pointer-events: none;
  white-space: nowrap;
}

.wy-empty {
  text-align: center;
  opacity: .55;
  padding: 30px 16px;
  font-size: 15px;
}

/* ============================================================
 * 舞台 · 立绘与关键帧（播放器与编辑器共用）
 * ============================================================ */

.wy-stagebox {
  position: relative;
  overflow: hidden;
}

.wy-stage-host {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.wy-stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.wy-sprite {
  position: absolute;
  left: 50%;
  bottom: 0;
  height: 90%;
  width: auto;
  max-width: none;
  transform-origin: bottom center;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .45));
  transition: filter .28s ease;
  will-change: transform, left, bottom, opacity;
}

/* 没在说话的人压暗 */
.wy-sprite.wy-dim {
  filter: brightness(.48) saturate(.6) drop-shadow(0 12px 28px rgba(0, 0, 0, .45));
}

/* 编辑器里立绘可拖动 */
.wy-stagebox.wy-editable .wy-sprite {
  pointer-events: auto;
  cursor: grab;
  touch-action: none;
}
.wy-stagebox.wy-editable .wy-sprite.wy-grabbing { cursor: grabbing; }
.wy-stagebox.wy-editable .wy-stage {
  outline: 1px dashed rgba(255, 255, 255, .14);
  outline-offset: -6px;
}

.wy-stageempty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 22px;
  font-size: 14px;
  line-height: 1.8;
  color: #8b95a5;
  white-space: pre-line;
  pointer-events: none;
}

/* ---------- 说话人名牌 ---------- */

.wy-textbox { position: relative; }

.wy-namebar {
  display: none;
  position: absolute;
  top: -15px;
  left: 14px;
  padding: 2px 16px 3px;
  border-radius: 9px;
  background: var(--wy-accent, #5aa9ff);
  color: #08111c;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .5px;
  line-height: 1.7;
  box-shadow: 0 3px 12px rgba(0, 0, 0, .38);
  max-width: 70%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 这里绝对不能写 margin-top —— 它的特异性比 .wy-textbox 高，
   会把上面那句 margin-top:auto 的「钉在底部」覆盖掉，
   结果就是「旁白在底部、人物一说话就弹到中间」。
   要留空间就用 padding-top。 */
.wy-textbox.has-name { padding-top: 24px; }
.wy-textbox.has-name .wy-namebar { display: block; }

/* ============================================================
 * 整页界面：图鉴（人物 / 背包 / 状态）与存档
 * ============================================================ */

.wy-screen-host { position: absolute; inset: 0; z-index: 28; pointer-events: none; }
.wy-screen-host:empty { display: none; }

.wy-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--wy-bg, #0f1115);
  pointer-events: auto;
  animation: wy-screen-in .22s cubic-bezier(.2, .8, .3, 1);
}
@keyframes wy-screen-in { from { opacity: 0; transform: translateY(2%); } to { transform: none; opacity: 1; } }

.wy-screen-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;

  font-weight: 600;
}

  display: block;
  font-size: 11px;
  font-weight: 400;
  opacity: .55;
  line-height: 1.3;
}

.wy-screen-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 22px);
}

/* ---- 状态型分组：数值表 ---- */
.wy-status-list {
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 10%, transparent);
}
.wy-status-row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 13px 15px;
  background: color-mix(in srgb, var(--wy-fg, #fff) 5%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 5%, transparent);
}
.wy-status-row:last-child { border-bottom: none; }
.wy-status-row .k { flex: 1; opacity: .8; font-size: 14px; }
.wy-status-row .v { color: var(--wy-accent, #5aa9ff); font-size: 17px; font-variant-numeric: tabular-nums; }

/* ---- 列表型分组：条目卡片 ---- */
.wy-codex-list { display: flex; flex-direction: column; gap: 12px; }

.wy-codex-card {
  display: flex;
  gap: 13px;
  padding: 12px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--wy-fg, #fff) 6%, transparent);
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 10%, transparent);
  animation: wy-rise .3s ease backwards;
}
.wy-codex-card.wy-locked { opacity: .5; }

.wy-codex-pic {
  flex: none;
  width: 84px;
  height: 112px;
  border-radius: 10px;
  overflow: hidden;
  background: color-mix(in srgb, var(--wy-bg, #000) 60%, #fff 8%);
  display: grid;
  place-items: center;
}
.wy-codex-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wy-codex-card.wy-locked .wy-codex-pic img { filter: brightness(0); opacity: .45; }
.wy-codex-blank { font-size: 22px; opacity: .35; }

.wy-codex-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wy-codex-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.wy-codex-vars { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
.wy-codex-desc { font-size: 13px; line-height: 1.7; opacity: .72; white-space: pre-wrap; word-break: break-word; }

/* 数值小标签（图鉴与存档共用） */
.wy-cv {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 1.7;
  background: color-mix(in srgb, var(--wy-accent, #5aa9ff) 16%, transparent);
}
.wy-cv span { opacity: .78; }
.wy-cv b { color: var(--wy-accent, #5aa9ff); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---- 存档界面 ---- */
.wy-save-list { display: flex; flex-direction: column; gap: 11px; }

.wy-save-slot {
  display: flex;
  align-items: stretch;
  gap: 12px;
  padding: 11px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--wy-fg, #fff) 6%, transparent);
  border: 1px solid color-mix(in srgb, var(--wy-fg, #fff) 10%, transparent);
}
.wy-save-slot.wy-slot-auto { border-color: color-mix(in srgb, var(--wy-accent, #5aa9ff) 34%, transparent); }
.wy-save-slot.wy-slot-empty { opacity: .62; }

.wy-save-thumb {
  flex: none;
  width: 62px;
  height: 110px;
  border-radius: 9px;
  overflow: hidden;
  background: color-mix(in srgb, var(--wy-bg, #000) 70%, #fff 10%);
  display: grid;
  place-items: center;
}
.wy-save-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wy-save-noimg { font-size: 12px; opacity: .4; letter-spacing: 1px; }

.wy-save-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.wy-save-name { font-size: 15px; font-weight: 600; }
.wy-save-where {
  font-size: 13px;
  opacity: .78;
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.wy-save-time { font-size: 11px; opacity: .5; margin-top: 2px; font-variant-numeric: tabular-nums; }
.wy-save-vars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.wy-save-vars .wy-cv { font-size: 11px; padding: 1px 8px; }

.wy-save-acts {
  flex: none;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 7px;
}
.wy-save-acts .wy-btn { padding: 8px 14px; font-size: 13px; min-width: 62px; }

/* 菜单里图鉴入口与功能项之间的分隔 */
.wy-menu-sep {
  height: 1px;
  background: color-mix(in srgb, var(--wy-fg, #fff) 12%, transparent);
  margin: 4px 0 13px;
}

/* ============================================================
 * 选项自由摆放 / 选项图片 / 横屏 / 旋转提示
 * ============================================================ */

/* ---- 自由摆放：每个选项各自定位，可以摆到任意地方 ---- */
.wy-player.wy-ch-free .wy-choices {
  position: absolute;
  inset: 0;
  display: block;
  width: auto;
  max-width: none;
  padding: 0;
  margin: 0;
  pointer-events: none;
}
.wy-player.wy-ch-free .wy-main { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
.wy-player.wy-ch-free .wy-choice {
  position: absolute;
  left: var(--wy-choice-x, 50%);
  top: var(--wy-choice-y, 50%);
  transform: translate(-50%, -50%);
  width: var(--wy-choice-w, 100%);
  max-width: calc(100% - 20px);
  pointer-events: auto;
  animation: wy-fade .25s ease backwards;
}

/* ---- 选项自己的图片 ---- */
.wy-choice.wy-choice-hasimg { border-color: transparent; }

/* 整块就是一张图：拉伸铺满 + 按图片比例撑高 */
.wy-choice.wy-choice-imgonly {
  padding: 0;
  min-height: 52px;
  background-color: transparent;
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
  border-color: transparent;
}
.wy-choice.wy-choice-imgonly::before { content: none; }
.wy-choice.wy-choice-imgonly:active { background-color: transparent; transform: scale(.98); }

/* ---- 旋转提示 ---- */
.wy-rotate-hint {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  place-items: center;
  text-align: center;
  padding: 30px;
  background: var(--wy-bg, #0f1115);
  color: var(--wy-fg, #e9edf2);
  cursor: pointer;
}
.wy-player.wy-need-rotate .wy-rotate-hint { display: grid; }
.wy-rotate-inner { max-width: 340px; }
.wy-rotate-text { font-size: 19px; font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; }
.wy-rotate-sub { font-size: 13px; opacity: .5; }

/* ============================================================
 * 横屏版面
 * ============================================================ */

@media (orientation: landscape) {
  /* 横屏时一行太长了，正文和选项收窄居中更好读 */
  .wy-textbox,
  .wy-choices { align-self: center; width: 100%; max-width: 880px; }

  /* 绝对定位的几种模式不吃 align-self */
  .wy-player.wy-ch-center .wy-choices,
  .wy-player.wy-ch-bottom .wy-choices,
  .wy-player.wy-ch-free .wy-choices { align-self: auto; }

  .wy-hud { justify-content: center; }
  .wy-player { line-height: 1.72; }
  .wy-namebar { left: 50%; transform: translateX(-50%); }
}

/* 横屏又矮又小（手机横过来）时再紧一点 */
@media (orientation: landscape) and (max-height: 460px) {
  .wy-top { min-height: 40px; padding-top: env(safe-area-inset-top, 0px); }
  .wy-textbox { padding: 12px 15px; }
  .wy-choice { padding: 11px 14px; }
  .wy-screen-head { padding-top: calc(env(safe-area-inset-top, 0px) + 4px); }
}

/* ---- 选项框素材：九宫格（保住圆角，不会把边框拉变形） ---- */
.wy-player.wy-choicebg-slice.wy-choicebg-img .wy-choice:not(.wy-choice-imgonly),
.wy-player.wy-choicebg-slice .wy-choice.wy-choice-hasimg:not(.wy-choice-imgonly) {
  background-image: none;
  background-color: transparent;
  border-style: solid;
  border-width: 13px 18px;
  border-image: var(--wy-choice-img) 26% fill / 1 / 0 stretch;
  border-color: transparent;
  padding: 6px 10px;
}
.wy-player.wy-choicebg-slice.wy-shape-card.wy-choicebg-img .wy-choice:not(.wy-choice-imgonly),
.wy-player.wy-choicebg-slice.wy-shape-card .wy-choice.wy-choice-hasimg:not(.wy-choice-imgonly) {
  border-width: 15px 22px;
  padding: 4px 12px;
}

/* ============================================================
 * 固定比例画布
 *   网页没法强制手机转屏，所以横屏游戏就按 16:9 渲染，
 *   装不下时四周留边 —— 这样横屏游戏在任何设备上都真的能玩。
 * ============================================================ */

.wy-player.wy-fit-portrait,
.wy-player.wy-fit-landscape {
  position: fixed;
  inset: 0;
  margin: auto;
  overflow: hidden;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--wy-fg, #fff) 9%, transparent);
}

.wy-player.wy-fit-portrait {
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
}

.wy-player.wy-fit-landscape {
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
}

/* 换表情时不要让立绘硬切 */
.wy-sprite { transition: filter .28s ease, opacity .2s ease; }

.wy-textbox::-webkit-scrollbar { width: 4px; }
.wy-textbox::-webkit-scrollbar-thumb {

.wy-textbox::-webkit-scrollbar-track { background: transparent; }

.wy-player.wy-box-band .wy-main {

  padding-right: 0;
  padding-bottom: 0;

.wy-player.wy-box-band .wy-textbox {

  width: 100%;
  max-width: none;
  border-radius: 0;

  border-right: 0;

  background-color: transparent;
  padding: 4px 6px;

.wy-player.wy-skin-save .wy-save-slot {
  border-image: var(--wy-skin-save) 26% fill / 1 / 0 stretch;
  border-style: solid;
  border-width: 14px 16px;
  border-color: transparent;
  background-image: none;
  background-color: transparent;
  padding: 4px 6px;
}

.wy-player.wy-skin-panel .wy-sheet-body,
.wy-player.wy-skin-panel .wy-screen-body > * {
  background-image: none;
}
.wy-player.wy-skin-panel .wy-sheet-body {
  border-image: var(--wy-skin-panel) 26% fill / 1 / 0 stretch;
  border-style: solid;
  border-width: 16px 18px;
  border-color: transparent;
  background-color: transparent;

/* ============================================================

.wy-bubbles {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  overflow: hidden;

.wy-bubble {

}

/* ============================================================

(function (root) {
  'use strict';

  var FORMAT = 'wenyu';
  var VERSION = 7;
  var FILE_EXT = '.wy';

  var VAR_TYPES = ['number', 'string', 'bool'];
  var OPS = [
    { id: '==', label: '等于' },

    { id: '>=', label: '大于等于' },
    { id: '<=', label: '小于等于' },

    { id: '<', label: '小于' },
    { id: 'contains', label: '包含文字' },
    { id: 'truthy', label: '已开启' },
    { id: 'falsy', label: '未开启' }
  ];
  var EFFECT_OPS = [
    { id: 'add', label: '增加' },
    { id: 'sub', label: '减少' },
    { id: 'set', label: '设为' },
    { id: 'face', label: '换表情' }
  ];

  var _seq = 0;
  function uid(prefix) {
    _seq = (_seq + 1) % 100000;
    return (prefix || 'id') + '_' +
      Date.now().toString(36) + '_' +
      _seq.toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function nowISO() { return new Date().toISOString(); }

  function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------------- 构造器 ---------------- */

  var DISPLAY_MODES = [
    { id: 'off', label: '不显示' },
    { id: 'codex', label: '只在图鉴 / 状态里' },
    { id: 'top', label: '顶部常驻显示' }
  ];

  function newVar(over) {
    return assign({ key: '新变量', type: 'number', initial: 0, display: 'off' }, over);
  }

  function varDisplay(def) {
    if (!def) return 'off';
    if (def.display) return def.display;
    return def.show ? 'top' : 'off';   // v2 以前只有 show 布尔
  }

  function newEffect(over) {
    return assign({ op: 'add', key: '', value: 1 }, over);
  }

  function newRule(over) {
    return assign({ key: '', op: '>=', value: 1 }, over);
  }

  function newChoice(over) {
    return assign({
      id: uid('c'),
      text: '',
      to: null,
      once: false,
      condition: null,
      effects: [],
      img: null,          // 这个选项自己的图片素材
      hideText: false,    // 图片本身就是选项内容，不显示文字
      x: null,            // 自由摆放时这个选项自己的位置（null = 跟着整块走）
      y: null
    }, over);
  }

  function newNode(over) {
    return assign({
      id: uid('n'),
      title: '',
      text: '',
      bg: null,
      bgm: null,
      sfx: null,
      onEnter: [],
      choices: [],
      autoNext: null,
      ending: null,
      speaker: null,
      choiceLayout: null,     // 这一场的选项位置（null = 跟随全局）
      bubbles: [],            // 情绪气泡
      stage: emptyStage()
    }, over);
  }

  function newProject(over) {
    var start = newNode({ title: '开场', text: '在这里写下你的开场白。\n\n点下面的「添加选项」，就能让故事分岔。' });
    return assign({
      format: FORMAT,
      version: VERSION,
      id: uid('p'),
      meta: {
        title: '我的文字游戏',
        author: '柳漪春涛',
        desc: '',
        cover: null,
        createdAt: nowISO(),
        updatedAt: nowISO()
      },
      config: {
        startNode: start.id,
        vars: [newVar({ key: '好感度', type: 'number', initial: 0, display: 'codex' })],
        theme: {
          bg: '#0f1115',
          fg: '#e9edf2',
          accent: '#5aa9ff',
          fontSize: 18,
          font: ''
        },
        ui: defaultUI()
      },
      // 默认给一个「状态」页：新玩家点开菜单就能看到数值，不用挂在屏幕顶上
      codex: {
        groups: [newCodexGroup({ name: '状态', icon: '📊', kind: 'status', order: 0 })],
        entries: []
      },
      assets: {},
      nodes: [start]
    }, over);
  }

  function assign(target) {
    for (var i = 1; i < arguments.length; i++) {
      var src = arguments[i];
      if (!src) continue;
      for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) target[k] = src[k];
    }
    return target;
  }

  /* ---------------- 变量与规则引擎 ---------------- */

  function coerce(value, type) {
    if (type === 'number') return num(value);
    if (type === 'bool') return value === true || value === 'true' || value === 1 || value === '1';
    return value == null ? '' : String(value);
  }

  function initialVars(project) {
    var vars = {};
    var defs = (project && project.config && project.config.vars) || [];
    for (var i = 0; i < defs.length; i++) {
      if (!defs[i] || !defs[i].key) continue;
      vars[defs[i].key] = coerce(defs[i].initial, defs[i].type);
    }
    return vars;
  }

  function varDef(project, key) {
    var defs = (project && project.config && project.config.vars) || [];
    for (var i = 0; i < defs.length; i++) if (defs[i].key === key) return defs[i];
    return null;
  }

  function varType(project, key) {
    var d = varDef(project, key);
    return d ? d.type : 'number';
  }

  function looseEq(a, b) {
    if (a === b) return true;
    var sa = a === null || a === undefined ? '' : String(a);
    var sb = b === null || b === undefined ? '' : String(b);
    if (sa === sb) return true;
    if (sa !== '' && sb !== '' && !isNaN(Number(sa)) && !isNaN(Number(sb))) return Number(sa) === Number(sb);
    return false;
  }

  function evalRule(vars, r) {
    if (!r) return true;
    var cur = vars[r.key];
    var op = r.op || '==';
    if (op === 'truthy') return !!cur;
    if (op === 'falsy') return !cur;
    if (op === '==') return looseEq(cur, r.value);
    if (op === '!=') return !looseEq(cur, r.value);
    if (op === 'contains') return String(cur == null ? '' : cur).indexOf(String(r.value == null ? '' : r.value)) >= 0;
    var a = num(cur), b = num(r.value);
    if (op === '>') return a > b;
    if (op === '>=') return a >= b;
    if (op === '<') return a < b;
    if (op === '<=') return a <= b;
    return false;
  }

  function evalCondition(vars, cond) {
    if (!cond || !cond.rules || !cond.rules.length) return true;
    var out = false;
    for (var i = 0; i < cond.rules.length; i++) {
      var ok = evalRule(vars, cond.rules[i]);
      if (cond.logic === 'or') { if (ok) return true; out = false; }
      else { if (!ok) return false; out = true; }
    }
    return out;
  }

  function applyEffects(project, vars, effects, faces) {
    if (!effects) return vars;
    for (var i = 0; i < effects.length; i++) {
      var e = effects[i];
      if (!e) continue;
      // 「换表情」不改数值，改的是某个角色此刻的脸
      if (e.op === 'face') {
        if (faces && e.actorId) faces[e.actorId] = e.face || '默认';
        continue;
      }
      if (!e.key) continue;
      var type = varType(project, e.key);
      if (e.op === 'add') {
        if (type === 'string') vars[e.key] = String(vars[e.key] == null ? '' : vars[e.key]) + String(e.value == null ? '' : e.value);
        else vars[e.key] = num(vars[e.key]) + num(e.value);
      } else if (e.op === 'sub') {
        vars[e.key] = num(vars[e.key]) - num(e.value);
      } else {
        vars[e.key] = coerce(e.value, type);
      }
    }
    return vars;
  }

  /** 某场景当前可显示的选项（过滤掉条件和一次性选项） */
  function availableChoices(project, node, vars, usedChoices) {
    var out = [];
    var list = (node && node.choices) || [];
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (c.once && usedChoices && usedChoices[c.id]) continue;
      if (!evalCondition(vars, c.condition)) continue;
      out.push(c);
    }
    return out;
  }

  /* ============================================================

   * ============================================================ */

  var CHOICE_LAYOUTS = [

    { id: 'center', label: '画面中间' },

  var ORIENTATIONS = [

  ];

  ];
  var CHOICE_BGFITS = [
    { id: 'slice', label: '九宫格（保住圆角，适合带边框的图）' },
    { id: 'stretch', label: '拉伸铺满（适合纹理 / 渐变图）' }

  ];

  /** 可以被作者换成自己素材的界面部位 */
  var SKIN_SLOTS = [
    { id: 'box', label: '对话框底图', hint: '对话框那一整条的底图' },
    { id: 'name', label: '说话人名牌' },
    { id: 'codex', label: '图鉴卡片底' },
    { id: 'save', label: '存档格底' },
    { id: 'panel', label: '菜单 / 设置面板底' }
  ];

  var SKIN_FITS = [
    { id: 'slice', label: '九宫格（保住四角，适合带边框的图）' },

  ];

  var BOX_STYLES = [

  function defaultUI() {
    return {
      hudTop: false,              // 变量是否常驻屏幕顶部（默认关，玩家抱怨过）
      font: null,                 // 自定义字体素材 id
      fontScale: 1,

      // 这样长台词也不会一路顶上去把立绘挡住

      // 界面素材：留空就用内置样式；填了就整套换成作者自己的图
      skins: { box: null, name: null, codex: null, save: null, panel: null },

      choice: {

  /* ============================================================
   * 图鉴：分组 + 条目

   *   条目 = 一张图 + 名称 + 说明 + 要展示的变量。
   *   分组 kind: 'list' 显示条目卡片；'status' 直接列出变量表。
   * ============================================================ */

  function defaultCodex() {
    return { groups: [], entries: [] };
  }

  function newCodexGroup(over) {
    return assign({
      id: uid('g'),
      name: '人物',
      icon: '📖',
      kind: 'list',
      order: 0
    }, over);
  }

  function newCodexEntry(over) {
    return assign({
      id: uid('e'),
      groupId: null,
      name: '',
      image: null,
      desc: '',
      vars: [],
      unlock: null,
      blurLocked: true          // 没解锁时显示成「???」而不是直接消失
    }, over);
  }

  function ensureCodex(project) {
    if (!project.codex || typeof project.codex !== 'object') project.codex = defaultCodex();
    if (!Array.isArray(project.codex.groups)) project.codex.groups = [];
    if (!Array.isArray(project.codex.entries)) project.codex.entries = [];
    return project.codex;
  }

  function codexGroups(project) {
    var c = ensureCodex(project);
    return c.groups.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  }

  function codexEntriesOf(project, groupId) {
    return ensureCodex(project).entries.filter(function (e) { return e.groupId === groupId; });
  }

  /** 某一场实际生效的选项位置：单场设置优先，否则用全局 */
  function effectiveChoiceLayout(project, node) {
    if (node && node.choiceLayout) return node.choiceLayout;
    return ensureUI(project).choice.layout;
  }

  function codexEntryVisible(vars, entry) {
    return !entry.unlock || evalCondition(vars, entry.unlock);
  }

  /** 状态型分组要列的变量：所有「不隐藏」的变量 */
  function statusVars(project) {
    return (project.config.vars || []).filter(function (d) {
      return d.key && varDisplay(d) !== 'off';
    });
  }

  /** 菜单里该出现哪些图鉴入口（空分组不出现） */
  function codexMenu(project) {
    return codexGroups(project).filter(function (g) {
      if (g.kind === 'status') return statusVars(project).length > 0;
      return codexEntriesOf(project, g.id).length > 0;
    });
  }

  /* ============================================================
   * 舞台与关键帧
   *   角色 actor  = 用哪张立绘、叫什么名字
   *   轨道 track  = 一个角色的关键帧序列（按时间排序）
   *   关键帧 key  = 某时刻的位置/缩放/透明度/翻转
   * 播放器在两个关键帧之间自动补间。
   * ============================================================ */

  var EASES = [
    { id: 'out', label: '先快后慢' },
    { id: 'linear', label: '匀速' },
    { id: 'inout', label: '两头慢' },
    { id: 'in', label: '先慢后快' }
  ];

  var STAGE_DEFAULTS = { x: 0.5, y: 1, scale: 1, opacity: 1, flip: false };

  function emptyStage() { return { actors: [], tracks: [] }; }

  function newActor(over) {
    return assign({
      id: uid('ac'),
      sprite: null,      // 「默认」那张立绘
      faces: [],         // 表情差分：[{ id, name, img }]，name 为「微笑」「生气」这类
      name: '',
      dim: true,
      z: 0
    }, over);
  }

  var BUBBLE_ANIMS = [
    { id: 'none', label: '不动' },
    { id: 'pop', label: '弹出来' },
    { id: 'blink', label: '闪烁' },
    { id: 'float', label: '上下飘' },
    { id: 'shake', label: '左右抖' },
    { id: 'pulse', label: '一缩一放' }
  ];

  /** 情绪气泡：可以是一张图，也可以是一张动图（GIF） */
  function newBubble(over) {
    return assign({
      id: uid('bb'),
      img: null,
      x: 0.5,
      y: 0.3,
      scale: 1,
      flip: false,
      anim: 'pop',      // none | pop | blink | float | shake | pulse
      at: 0,            // 第几毫秒冒出来
      dur: 0            // 持续多久（0 = 一直到本场结束）
    }, over);
  }

  /** 某一时刻该显示哪些气泡 */
  function bubblesAt(node, t) {
    var list = (node && node.bubbles) || [];
    return list.filter(function (b) {
      var at = b.at || 0;
      if (t < at) return false;
      if (b.dur > 0 && t > at + b.dur) return false;
      return true;
    });
  }

  function newFace(over) {
    return assign({ id: uid('fc'), name: '表情', img: null }, over);
  }

  /** 某个角色在指定表情下该用哪张图 */
  function actorFaceImage(actor, faceName) {
    if (!actor) return null;
    var want = faceName == null ? '默认' : String(faceName);
    if (!want || want === '默认') return actor.sprite || null;
    var list = actor.faces || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === want && list[i].img) return list[i].img;
    }
    return actor.sprite || null;   // 表情没配图就退回默认
  }

  /** 这个角色能用的表情名（含默认） */
  function actorFaceNames(actor) {
    var out = ['默认'];
    (actor && actor.faces ? actor.faces : []).forEach(function (fc) {
      if (fc.name && out.indexOf(fc.name) < 0) out.push(fc.name);
    });
    return out;
  }

  /** 正在用某张脸的角色的缓存键 */
  function actorImageKey(actor, faceName) {
    return actor.id + '|' + actorFaceImage(actor, faceName);
  }

  function newKey(over) {
    return assign({
      id: uid('k'),
      at: 0,
      x: STAGE_DEFAULTS.x,
      y: STAGE_DEFAULTS.y,
      scale: STAGE_DEFAULTS.scale,
      opacity: STAGE_DEFAULTS.opacity,
      flip: STAGE_DEFAULTS.flip
    }, over);
  }

  function ensureStage(node) {
    if (!node.stage || typeof node.stage !== 'object') node.stage = emptyStage();
    if (!Array.isArray(node.stage.actors)) node.stage.actors = [];
    if (!Array.isArray(node.stage.tracks)) node.stage.tracks = [];
    return node.stage;
  }

  function getActor(node, id) {
    var st = ensureStage(node);
    for (var i = 0; i < st.actors.length; i++) if (st.actors[i].id === id) return st.actors[i];
    return null;
  }

  function getTrack(node, actorId, create) {
    var st = ensureStage(node);
    for (var i = 0; i < st.tracks.length; i++) if (st.tracks[i].actorId === actorId) return st.tracks[i];
    if (!create) return null;
    var t = { actorId: actorId, keys: [] };
    st.tracks.push(t);
    return t;
  }

  function sortTrack(track) {
    if (track && track.keys) track.keys.sort(function (a, b) { return a.at - b.at; });
    return track;
  }

  /* ---------------- 缓动与补间 ---------------- */

  function applyEase(ease, t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    if (ease === 'out') return 1 - Math.pow(1 - t, 3);
    if (ease === 'in') return t * t * t;
    if (ease === 'inout') return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    return t;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function keyProps(k) {
    return { x: k.x, y: k.y, scale: k.scale, opacity: k.opacity, flip: !!k.flip };
  }

  function lerpKey(from, to, rawT, ease) {
    var t = applyEase(ease, rawT);
    return {
      x: lerp(from.x, to.x, t),
      y: lerp(from.y, to.y, t),
      scale: lerp(from.scale, to.scale, t),
      opacity: lerp(from.opacity, to.opacity, t),
      // 翻转不插值：走到下一个关键帧的那一刻才切换
      flip: !!from.flip
    };
  }

  /** 某轨道在 t 时刻的状态；返回 null 表示这个角色还没上场 */
  function trackPropsAt(track, t, ease) {
    if (!track || !track.keys || !track.keys.length) return null;
    var keys = track.keys;
    if (t < keys[0].at) return null;
    if (keys.length === 1 || t >= keys[keys.length - 1].at) return keyProps(keys[keys.length - 1]);
    for (var i = 0; i < keys.length - 1; i++) {
      var a = keys[i], b = keys[i + 1];
      if (t >= a.at && t < b.at) {
        var span = b.at - a.at;
        return lerpKey(a, b, span <= 0 ? 1 : (t - a.at) / span, ease || 'out');
      }
    }
    return keyProps(keys[keys.length - 1]);
  }

  /** 整个舞台在 t 时刻的样子：[{actor, props}]，已按层级排序 */
  function stageAt(node, t, ease) {
    if (!node || !node.stage) return [];
    var st = ensureStage(node);
    var out = [];
    for (var i = 0; i < st.actors.length; i++) {
      var actor = st.actors[i];
      var props = trackPropsAt(getTrack(node, actor.id), t, ease);
      if (props) out.push({ actor: actor, props: props });
    }
    out.sort(function (a, b) {
      var za = a.actor.z || 0, zb = b.actor.z || 0;
      if (za !== zb) return za - zb;
      return a.props.scale - b.props.scale;
    });
    return out;
  }

  /** 舞台总时长（最后一个关键帧的时刻） */
  function stageDuration(node) {
    if (!node || !node.stage) return 0;
    var st = ensureStage(node);
    var max = 0;
    for (var i = 0; i < st.tracks.length; i++) {
      var keys = st.tracks[i].keys || [];
      for (var j = 0; j < keys.length; j++) if (keys[j].at > max) max = keys[j].at;
    }
    return max;
  }

  function actorHasStage(node, actorId) {
    var t = getTrack(node, actorId);
    return !!(t && t.keys && t.keys.length);
  }

  /* ---------------- 一键预设 ---------------- */

  var PRESETS = [
    { id: 'appear', label: '直接出现', mode: 'replace', dur: 0 },
    { id: 'slideLeft', label: '从左边滑入', mode: 'replace', dur: 520 },
    { id: 'slideRight', label: '从右边滑入', mode: 'replace', dur: 520 },
    { id: 'fadeIn', label: '淡入', mode: 'replace', dur: 500 },
    { id: 'popIn', label: '弹出放大', mode: 'replace', dur: 340 },
    { id: 'exitLeft', label: '滑向左边退场', mode: 'append', dur: 450 },
    { id: 'exitFade', label: '淡出退场', mode: 'append', dur: 450 },
    { id: 'shake', label: '左右抖动', mode: 'append', dur: 420 },
    { id: 'move', label: '平移到当前帧位置', mode: 'append', dur: 500 }
  ];

  /**
   * 生成预设的关键帧序列。
   * @param id      预设 id
   * @param base    该角色的"落位"（通常取它当前选中的关键帧或默认值）
   * @param startAt append 模式下的起始时刻
   */
  function buildPreset(id, base, startAt) {
    base = assign({}, STAGE_DEFAULTS, base || {});
    var s = startAt || 0;
    var K = function (at, over) { return newKey(assign({ at: at, x: base.x, y: base.y, scale: base.scale, opacity: base.opacity, flip: base.flip }, over)); };
    var off = function (dx) { return { x: base.x + dx }; };

    switch (id) {
      case 'appear':
        return [K(0)];
      case 'slideLeft':
        return [K(s, assign({ x: -0.2 }, {})), K(s + 520, { x: base.x })];
      case 'slideRight':
        return [K(s, { x: 1.2 }), K(s + 520, { x: base.x })];
      case 'fadeIn':
        return [K(s, { opacity: 0 }), K(s + 500, { opacity: base.opacity })];
      case 'popIn':
        return [K(s, { scale: base.scale * 0.25, opacity: 0 }), K(s + 340, { scale: base.scale, opacity: base.opacity })];
      case 'exitLeft':
        return [K(s, {}), K(s + 450, { x: -0.25 })];
      case 'exitFade':
        return [K(s, {}), K(s + 450, { opacity: 0 })];
      case 'shake': {
        var out = [K(s, {})];
        for (var i = 1; i <= 6; i++) out.push(K(s + i * 70, { x: base.x + (i % 2 ? 0.03 : -0.03) }));
        out.push(K(s + 490, { x: base.x }));
        return out;
      }
      case 'move':
        return [K(s, {}), K(s + 500, { x: base.x })];
      default:
        return [K(s, {})];
    }
  }

  function presetLabel(id) {
    for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].id === id) return PRESETS[i].label;
    return id;
  }

  /* ---------------- 查询 ---------------- */

  function getNode(project, id) {
    if (!project || !project.nodes) return null;
    for (var i = 0; i < project.nodes.length; i++) if (project.nodes[i].id === id) return project.nodes[i];
    return null;
  }

  function nodeIndex(project, id) {
    if (!project || !project.nodes) return -1;
    for (var i = 0; i < project.nodes.length; i++) if (project.nodes[i].id === id) return i;
    return -1;
  }

  function nodeLabel(project, id) {
    var idx = nodeIndex(project, id);
    if (idx < 0) return '（未连接）';
    var n = project.nodes[idx];
    var t = (n.title || '').trim() || firstLine(n.text) || '空场景';
    return '#' + (idx + 1) + ' ' + t.slice(0, 14);
  }

  function firstLine(text) {
    if (!text) return '';
    var s = String(text).split('\n')[0].trim();
    return s;
  }

  /** 图片素材的宽高（上传时记下来，纯图片选项靠它撑对比例） */
  function assetSize(asset) {
    if (!asset) return null;
    if (asset.w && asset.h) return { w: asset.w, h: asset.h };
    return null;
  }

  function assetList(project) {
    var out = [];
    var a = (project && project.assets) || {};
    for (var k in a) if (Object.prototype.hasOwnProperty.call(a, k)) out.push(assign({ id: k }, a[k]));
    out.sort(function (x, y) { return (x.name || '').localeCompare(y.name || ''); });
    return out;
  }

  function assetsOfType(project, type) {
    return assetList(project).filter(function (a) { return a.type === type; });
  }

  function assetUsage(project) {
    var used = {};
    var nodes = (project && project.nodes) || [];
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.bg) used[n.bg] = true;
      if (n.bgm) used[n.bgm] = true;
      if (n.sfx) used[n.sfx] = true;
      // 立绘也是素材，漏掉的话「清理未使用素材」会把正在用的立绘删掉
      var actors = (n.stage && n.stage.actors) || [];
      for (var j = 0; j < actors.length; j++) {
        if (actors[j].sprite) used[actors[j].sprite] = true;
        // 表情差分的图也算在用
        var faces = actors[j].faces || [];
        for (var k2 = 0; k2 < faces.length; k2++) {
          if (faces[k2].img) used[faces[k2].img] = true;
        }
      }
    }
    if (project && project.meta && project.meta.cover) used[project.meta.cover] = true;

    // 界面配置里引用的素材：字体、选项框
    var ui = project && project.config && project.config.ui;
    if (ui) {
      if (ui.font) used[ui.font] = true;
      if (ui.choice && ui.choice.bg) used[ui.choice.bg] = true;
    }
    // 界面素材（对话框底图、名牌、图鉴卡片底…）
    if (ui && ui.skins) {
      Object.keys(ui.skins).forEach(function (k) { if (ui.skins[k]) used[ui.skins[k]] = true; });
    }
    // 情绪气泡
    for (var bi = 0; bi < nodes.length; bi++) {
      var bubs = nodes[bi].bubbles || [];
      for (var bj = 0; bj < bubs.length; bj++) if (bubs[bj].img) used[bubs[bj].img] = true;
    }
    // 图鉴条目的配图
    var codex = project && project.codex;
    if (codex && Array.isArray(codex.entries)) {
      for (var ci = 0; ci < codex.entries.length; ci++) {
        if (codex.entries[ci].image) used[codex.entries[ci].image] = true;
      }
    }
    return used;
  }

  /* ---------------- 校验 ---------------- */

  function validate(project) {
    var issues = [];
    var nodes = (project && project.nodes) || [];
    var ids = {};
    for (var i = 0; i < nodes.length; i++) ids[nodes[i].id] = true;

    if (!project.config.startNode || !ids[project.config.startNode]) {
      issues.push({ level: 'error', text: '起始场景无效，试玩会失败。' });
    }

    var reachable = {};
    var queue = [project.config.startNode];
    var guard = 0;
    while (queue.length && guard++ < 20000) {
      var cur = queue.shift();
      if (!cur || reachable[cur] || !ids[cur]) continue;
      reachable[cur] = true;
      var n = getNode(project, cur);
      if (!n) continue;
      var cs = n.choices || [];
      for (var j = 0; j < cs.length; j++) {
        if (cs[j].to) queue.push(cs[j].to);
      }
      if (n.autoNext) queue.push(n.autoNext);
    }

    for (var k = 0; k < nodes.length; k++) {
      var node = nodes[k];
      var label = '#' + (k + 1) + ' ' + (node.title || firstLine(node.text) || '空场景');
      // 判定标准是「有没有结局对象」，不是「有没有写字」——
      // 否则刚点完「设为结局」就会因为标题为空而被判回「不是结局」。
      var hasEnding = !!node.ending;
      if ((!node.text || !node.text.trim()) && !hasEnding) {
        if (!node.choices || !node.choices.length) issues.push({ level: 'warn', nodeId: node.id, text: label + '：没有正文也没有选项。' });
      }
      var cs2 = node.choices || [];
      for (var m = 0; m < cs2.length; m++) {
        if (!cs2[m].to) {
          issues.push({ level: 'warn', nodeId: node.id, text: label + '：选项「' + (cs2[m].text || '(空)') + '」没有指定去向。' });
        } else if (!ids[cs2[m].to]) {
          issues.push({ level: 'error', nodeId: node.id, text: label + '：选项「' + (cs2[m].text || '(空)') + '」指向了已删除的场景。' });
        }
      }
      if (node.autoNext && !ids[node.autoNext]) {
        issues.push({ level: 'error', nodeId: node.id, text: label + '：自动跳转指向了已删除的场景。' });
      }
      if (!cs2.length && !node.autoNext && !hasEnding) {
        issues.push({ level: 'warn', nodeId: node.id, text: label + '：没有选项也不是结局，玩家会卡在这里。' });
      }
      if (!reachable[node.id]) {
        issues.push({ level: 'warn', nodeId: node.id, text: label + '：从开场走不到（孤岛场景）。' });
      }
    }

    var effs = [];
    for (var p = 0; p < nodes.length; p++) {
      var nn = nodes[p];
      var all = (nn.onEnter || []).slice();
      var cc = nn.choices || [];
      for (var q = 0; q < cc.length; q++) all = all.concat(cc[q].effects || []);
      for (var r2 = 0; r2 < all.length; r2++) {
        if (all[r2].key && !varDef(project, all[r2].key)) {
          effs.push('#' + (p + 1) + ' 用到了未定义的变量「' + all[r2].key + '」');
        }
      }
    }
    if (effs.length) issues.push({ level: 'warn', text: '变量未定义：' + effs.slice(0, 3).join('；') + (effs.length > 3 ? ' 等' : '') });

    // 图鉴 / 界面配置的引用检查
    var codex = project.codex;
    if (codex && Array.isArray(codex.entries)) {
      codex.entries.forEach(function (e, i) {
        var label = '图鉴条目「' + (e.name || '#' + (i + 1)) + '」';
        if (e.groupId && !codex.groups.some(function (g) { return g.id === e.groupId; })) {
          issues.push({ level: 'warn', text: label + '：所属分组已被删除，玩家看不到它。' });
        }
        if (e.image && !(project.assets || {})[e.image]) {
          issues.push({ level: 'warn', text: label + '：配图已被删除。' });
        }
        (e.vars || []).forEach(function (k) {
          if (!varDef(project, k)) issues.push({ level: 'warn', text: label + '：要显示的变量「' + k + '」不存在了。' });
        });
        if (!e.name) issues.push({ level: 'warn', text: label + '：还没有名字。' });
      });
    }
    var ui = project.config.ui;
    if (ui) {
      if (ui.font && !(project.assets || {})[ui.font]) issues.push({ level: 'warn', text: '自定义字体已被删除，会退回系统字体。' });
      if (ui.choice && ui.choice.bg && !(project.assets || {})[ui.choice.bg]) issues.push({ level: 'warn', text: '选项框素材已被删除。' });
      if (ui.skins) {
        SKIN_SLOTS.forEach(function (slot) {
          if (ui.skins[slot.id] && !(project.assets || {})[ui.skins[slot.id]]) {
            issues.push({ level: 'warn', text: slot.label + '的素材已被删除，会退回内置样式。' });
          }
        });
      }
    }
    // 气泡
    nodes.forEach(function (n, i2) {
      (n.bubbles || []).forEach(function (b) {
        if (b.img && !(project.assets || {})[b.img]) {
          issues.push({ level: 'warn', nodeId: n.id, text: '#' + (i2 + 1) + ' 有个情绪气泡的图已被删除。' });
        }
      });
    });

    return issues;
  }

  /** 统计信息，用于工程列表和导出提示 */
  function stats(project) {
    var chars = 0;
    var nodes = (project && project.nodes) || [];
    for (var i = 0; i < nodes.length; i++) chars += (nodes[i].text || '').length;
    var bytes = 0;
    var a = (project && project.assets) || {};
    for (var k in a) if (Object.prototype.hasOwnProperty.call(a, k)) bytes += (a[k].data || '').length;
    return {
      nodes: nodes.length,
      chars: chars,
      endings: nodes.filter(function (n) { return !!n.ending; }).length,
      choices: nodes.reduce(function (s, n) { return s + ((n.choices || []).length); }, 0),
